<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles — Conseils web | Thibault Dubois</title><meta name="description" content="Conseils pratiques sur la création de site internet, le référencement et les outils numériques pour les entreprises en Bretagne."><link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"><link rel="stylesheet" href="assets/css/style.css"></head>
<body><header class="navbar"><div class="container"><a href="index.html" class="brand"><span class="brand-mark">TD</span> Thibault Dubois</a><nav class="nav-links" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="services.html">Prestations</a><a href="blog.html" aria-current="page">Articles</a><a href="a-propos.html">À propos</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><a href="contact.html" class="btn btn-primary btn-sm">Devis gratuit</a></div></div></header>
<main><section class="page-hero"><div class="container"><span class="eyebrow">Ressources</span><h1>Des articles pour faire avancer vos projets web</h1><p>Conseils clairs sur le référencement, la création de site et les outils numériques.</p></div></section><section><div class="container"><div id="articles" class="grid-3"><p>Chargement des articles...</p></div><nav id="pagination" class="row" style="justify-content:center;margin-top:36px" aria-label="Pagination"></nav></div></section></main><footer class="site-footer"><div class="container"><div class="footer-bottom" style="border-top:0"><span>© <span id="year"></span> Thibault Dubois</span><span><a href="mentions-legales.html">Mentions légales</a></span></div></div></footer>
<script>const list=document.querySelector('#articles'),pager=document.querySelector('#pagination');const esc=v=>String(v||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(page=1){const r=await fetch('/api/articles?page='+page);const d=await r.json();list.innerHTML=d.items.length?d.items.map(a=>`<article class="card"><${a.cover_image?'img src="'+esc(a.cover_image)+'" alt="" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin:-8px 0 20px">':'div'}><span class="eyebrow">Article</span><h2>${esc(a.title)}</h2><p>${esc(a.excerpt)}</p><a class="btn btn-secondary btn-sm" href="article.html?slug=${encodeURIComponent(a.slug)}">Lire l'article</a></article>`).join(''):'<p>Aucun article publié pour le moment.</p>';pager.innerHTML=Array.from({length:d.pages},(_,i)=>`<button class="btn ${i+1===d.page?'btn-primary':'btn-secondary'} btn-sm" data-page="${i+1}">${i+1}</button>`).join('');pager.querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.page))}load();document.querySelector('#year').textContent=new Date().getFullYear();</script></body></html>
